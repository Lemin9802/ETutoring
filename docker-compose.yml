services:
  frontend:
    image: etutoring-fe:latest
    container_name: etutoring-frontend
    env_file:
      - .env.release
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: etutoring-be:latest
    container_name: etutoring-backend
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: etutoring-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: etutoring-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
