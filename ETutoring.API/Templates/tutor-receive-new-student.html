<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Student Assigned</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

        h2 {
            color: #2c3e50;
        }

        p {
            font-size: 16px;
            color: #555555;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888888;
        }

        .student-list {
            list-style: none;
            padding: 0;
        }

            .student-list li {
                background: #ecf0f1;
                padding: 10px;
                margin: 5px 0;
                border-radius: 5px;
            }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hello, {{TutorName}}! 👋</h2>
        <p>Great news! You have been assigned {{StudentCount}} new student{{StudentPlural}}.</p>

        <ul class="student-list">
            {{StudentList}}
        </ul>

        <p>If you have any questions, feel free to reach out.</p>

        <p class="footer">Best Regards,<br><strong>The Tutoring Team</strong></p>
    </div>
</body>
</html>
